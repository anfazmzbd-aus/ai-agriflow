[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentos-agriflow"
version = "0.1.0"
description = "AgentOS framework and AgriFlow application platform."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "AgriFlow Team" },
]
keywords = ["agents", "agriculture", "langgraph", "agentos", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "typer>=0.12",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
]
dev = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pytest>=8.3,<10", 
  "ruff>=0.11,<1", 
  "mypy>=1.15,<2", 
  "build>=1,<2"
]

[project.scripts]
agriflow = "apps.agriflow.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos", "apps"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=agentos --cov=apps --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "apps", "examples", "tests"]
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "D100",
  "D104",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"examples/**/*.py" = ["D103"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = ["src"]
packages = ["agentos", "apps.agriflow"]

[tool.coverage.run]
branch = true
source = ["agentos", "apps"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
