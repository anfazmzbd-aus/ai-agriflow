name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Verify tag matches project version
        run: |
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; tag = os.environ['GITHUB_REF_NAME']; assert tag == f'v{version}', f'{tag} does not match v{version}'"
      - name: Run tests and enforce repository coverage
        run: uv run pytest -q
      - name: Check lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check types
        run: uv run mypy src
      - name: Build source distribution and wheel
        run: uv build --out-dir dist
      - name: Upload distributions for review
        uses: actions/upload-artifact@v4
        with:
          name: agentos-${{ github.ref_name }}-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
